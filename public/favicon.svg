<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- badge background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0C1020"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" stroke="#26304C"/>

  <!-- shelf platform -->
  <path d="M14 41.5 H50" stroke="#5A6785" stroke-width="3" stroke-linecap="round"/>
  <path d="M18 41.5 V47" stroke="#5A6785" stroke-width="3" stroke-linecap="round"/>
  <path d="M46 41.5 V47" stroke="#5A6785" stroke-width="3" stroke-linecap="round"/>

  <!-- gamepad -->
  <g>
    <rect x="15" y="27" width="19" height="12" rx="6" fill="#E8ECF6"/>
    <!-- d-pad -->
    <path d="M20 30.5 V35.5 M17.6 33 H22.4" stroke="#0C1020" stroke-width="1.8" stroke-linecap="round"/>
    <!-- buttons -->
    <circle cx="28.5" cy="31.6" r="1.5" fill="#0C1020"/>
    <circle cx="31" cy="34.4" r="1.5" fill="#0C1020"/>
  </g>

  <!-- music note -->
  <g fill="#E8ECF6">
    <rect x="40" y="24" width="2.6" height="13.5" rx="1.3"/>
    <rect x="48" y="22.5" width="2.6" height="15" rx="1.3"/>
    <path d="M40 24 L50.6 22.5 V26 L40 27.5 Z"/>
    <circle cx="39.3" cy="37" r="3.2"/>
    <circle cx="47.3" cy="35.5" r="3.2"/>
  </g>

  <!-- green check badge -->
  <rect x="24" y="10" width="16" height="16" rx="5" fill="#AAFF2E"/>
  <path d="M28 18 L31 21 L36.5 14.5" stroke="#0C1020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
